<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>InfraGuardian AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px 40px;
        }

        header h1 {
            margin: 0;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

        #result {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 5px;
            white-space: pre-wrap;
            min-height: 100px;
        }
    </style>
</head>

<body>

<header>
    <h1>InfraGuardian AI</h1>
    <p>AI-powered application testing</p>
</header>

<main>

    <div class="card">

        <h2>Run Test</h2>

        <form id="test-form">

            <label for="application-url">
                Application URL
            </label>

            <input
                id="application-url"
                type="url"
                placeholder="https://your-application.azurewebsites.net"
                required
            >

            <label for="instructions">
                Testing Instructions
            </label>

            <textarea
                id="instructions"
                placeholder="Test the customer creation workflow."
                required
            ></textarea>

            <button
                id="run-test"
                type="submit"
            >
                Start Test
            </button>

        </form>

        <div id="status"></div>

    </div>

    <div class="card">

        <h2>Test Result</h2>

        <div id="result">
            No test has been run.
        </div>

    </div>

</main>

<script>
    const API_URL = "{{ api_url }}";
</script>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
